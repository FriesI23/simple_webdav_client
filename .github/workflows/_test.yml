name: Test CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  dart-test:
    name: Dart Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the pinned SDK
        id: sdk
        run: echo "version=$(awk '$1 == "dart" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ steps.sdk.outputs.version }}
      - name: Resolve the lockfile
        run: make bootstrap
      - name: Verify generated code is reproducible
        run: |
          make gen
          make format
          git diff --exit-code -- lib test example
          test -z "$(git ls-files --others --exclude-standard -- lib test example)"
      - name: Check formatting
        run: make format-check
      - name: Require zero analyzer diagnostics
        if: success() || failure()
        run: make analyze
      - name: Run all tests
        if: success() || failure()
        run: make test CI=1 MACHINE_OUT=test-results/package_test.log
      - name: Validate publishing
        if: success() || failure()
        run: make publish-dry-run
      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: dart-test-results
          path: test-results/package_test.log
          if-no-files-found: warn
          retention-days: 7

  compatibility:
    name: SDK Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve compatible dependencies
        run: dart pub upgrade
      - name: Require zero analyzer diagnostics
        run: make analyze
      - name: Run all tests
        if: success() || failure()
        run: make test CI=1 MACHINE_OUT=test-results/package_test.log
      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: dart-test-results-compatibility
          path: test-results/package_test.log
          if-no-files-found: warn
          retention-days: 7
